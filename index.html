<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>股票熱力圖（可上傳 / 可分享）</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

  <style>
    :root { --border:#e5e7eb; --muted:#6b7280; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
    .bar { display:flex; gap:10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
    button { padding: 8px 10px; border: 1px solid var(--border); background: #fff; border-radius: 10px; cursor:pointer; }
    button:hover { background:#f9fafb; }
    input[type="file"] { padding: 6px 0; }
    input[type="text"], select {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      min-width: 260px; background:#fff;
    }
    #msg { padding: 10px 16px; color: #b91c1c; font-size: 13px; min-height: 20px; white-space: pre-wrap; }
    #chart { height: calc(100vh - 190px); }
    .ok { color: #047857 !important; }
    .drop {
      margin: 10px 16px 0;
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>股票熱力圖（上傳資料 → 產生分享連結）</h1>
    <div class="muted">
      預設會嘗試讀取同資料夾的 <b>data.csv</b>。
      支援拖拉/選檔上傳 CSV/XLSX/JSON。
      「產生分享連結」會把資料壓縮後放進網址 <b>#hash</b>。
    </div>
  </header>

  <div class="bar">
    <input id="file" type="file" accept=".csv,.xlsx,.xls,.json" />
    <button id="btnLoadDefault">載入（或重載）data.csv</button>

    <label class="muted" style="margin-left:4px;">顯示模式：</label>
    <select id="mode">
      <option value="none">單層：類股 → 股票</option>
      <option value="subcol" selected>雙層：類股 → 子分類欄位 → 股票</option>
      <option value="amountbin">雙層：類股 → 成交額分級（大/中/小）→ 股票</option>
    </select>

    <button id="btnShare">產生分享連結</button>
    <button id="btnCopy" disabled>複製分享連結</button>

    <span class="muted">或從網址載入 CSV：</span>
    <input id="csvUrl" type="text" placeholder="貼上 data.csv 的公開網址（raw）" />
    <button id="btnLoadUrl">從網址載入</button>
  </div>

  <div class="drop">📥 可把檔案直接拖曳到頁面任何位置放開（CSV / XLSX / JSON）。</div>
  <div id="msg"></div>
  <div id="chart"></div>

<script>
  const $msg = document.getElementById('msg');
  const $file = document.getElementById('file');
  const $btnLoadDefault = document.getElementById('btnLoadDefault');
  const $btnShare = document.getElementById('btnShare');
  const $btnCopy = document.getElementById('btnCopy');
  const $csvUrl = document.getElementById('csvUrl');
  const $btnLoadUrl = document.getElementById('btnLoadUrl');
  const $mode = document.getElementById('mode');

  let lastRawRows = null;      // 原始 rows（Papa/XLSX 轉出來的）
  let lastNormalizedRows = null;

  function setMsg(text, ok=false) {
    $msg.textContent = text || '';
    $msg.className = ok ? 'ok' : '';
  }

  // 把任何 JS 錯誤直接顯示出來（避免 GitHub Pages 一片白）
  window.addEventListener('error', (e) => {
    setMsg('⚠️ JS 錯誤：' + (e?.message || e), false);
  });
  window.addEventListener('unhandledrejection', (e) => {
    setMsg('⚠️ Promise 錯誤：' + (e?.reason?.message || e?.reason || e), false);
  });

  function toNumber(x) {
    if (x === null || x === undefined) return NaN;
    if (typeof x === 'number') return x;
    const s = String(x)
      .trim()
      .replace(/,/g,'')      // 1,234
      .replace(/％/g,'%')    // 全形
      .replace(/%/g,'');     // %
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  function pickColumn(headers, candidates) {
    const lower = headers.map(h => String(h).trim().toLowerCase());
    for (const c of candidates) {
      const idx = lower.indexOf(String(c).toLowerCase());
      if (idx >= 0) return headers[idx];
    }
    return null;
  }

  function quantiles(values) {
    const xs = values.filter(Number.isFinite).slice().sort((a,b)=>a-b);
    if (xs.length === 0) return {q1:0, q2:0};
    const q = (p) => {
      const idx = (xs.length - 1) * p;
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      if (lo === hi) return xs[lo];
      const t = idx - lo;
      return xs[lo] * (1 - t) + xs[hi] * t;
    };
    return {q1: q(0.33), q2: q(0.66)};
  }

  function amountBucket(v, q1, q2) {
    if (!Number.isFinite(v)) return '未知';
    if (v >= q2) return '大';
    if (v >= q1) return '中';
    return '小';
  }

  function normalizeRows(rawRows, mode) {
    if (!Array.isArray(rawRows) || rawRows.length === 0) throw new Error('沒有讀到任何資料列。');

    const headers = Object.keys(rawRows[0] || {});
    if (headers.length === 0) throw new Error('找不到欄位（header）。');

    const colGroup  = pickColumn(headers, ['group','sector','industry','分類','產業','類別','類股']);
    const colSub    = pickColumn(headers, ['sub','subgroup','sub_group','subsector','sub_sector','子分類','子產業','次分類','次產業','細分','細項']);
    const colSymbol = pickColumn(headers, ['symbol','ticker','code','代碼','股票','stock','name','名稱']);
    const colValue  = pickColumn(headers, ['value','size','market_cap','marketcap','weight','市值','權重','成交金額','成交額','amount','turnover']);
    const colChange = pickColumn(headers, ['change','chg','return','pct','perf','漲跌','漲跌幅','報酬','報酬率','變動']);

    if (!colSymbol) throw new Error('找不到「symbol」欄位（可接受：symbol/ticker/code/代碼/股票/名稱）。');
    if (!colChange) throw new Error('找不到「change」欄位（可接受：change/return/pct/漲跌幅/報酬率）。');

    // 先做基本轉換（這裡就直接把 sub 從「同一列」取出來，避免我前一版那種 find 誤判）
    let rows = rawRows.map((r) => {
      const group = colGroup ? String(r[colGroup] ?? '未分類').trim() : '未分類';
      const symbol = String(r[colSymbol] ?? '').trim();
      const value = colValue ? toNumber(r[colValue]) : 1;
      const change = toNumber(r[colChange]);

      if (!symbol) return null;

      const sub = (mode === 'subcol')
        ? (colSub ? String(r[colSub] ?? '未分類').trim() : null)
        : '';

      if (mode === 'subcol' && !sub) {
        // 你選了 subcol 但資料沒子分類欄位：直接明確報錯（避免一片白）
        throw new Error('你選了「子分類欄位」模式，但資料找不到子分類欄位（可接受：sub/subgroup/子分類/子產業/次分類…）。');
      }

      return {
        group,
        sub: (mode === 'subcol') ? (sub || '未分類') : '',
        symbol,
        value: Number.isFinite(value) && value > 0 ? value : 1,
        change: Number.isFinite(change) ? change : 0
      };
    }).filter(Boolean);

    if (rows.length === 0) throw new Error('資料列解析後為空（可能 symbol 欄位都是空的）。');

    if (mode === 'amountbin') {
      // 依「每個類股內」的 value 分位數切成交額大/中/小
      const byGroup = new Map();
      for (const r of rows) {
        if (!byGroup.has(r.group)) byGroup.set(r.group, []);
        byGroup.get(r.group).push(r.value);
      }
      const qMap = new Map();
      for (const [g, vs] of byGroup.entries()) qMap.set(g, quantiles(vs));
      rows = rows.map(r => {
        const {q1, q2} = qMap.get(r.group) || {q1:0, q2:0};
        return {...r, sub: `成交額${amountBucket(r.value, q1, q2)}`};
      });
    }

    return rows;
  }

  function buildTreemap(rows, mode) {
    // 用 ids 避免 label 重複被 Plotly 合併
    const ids = [], labels = [], parents = [], values = [], colors = [];

    const ROOT_ID = 'root';
    ids.push(ROOT_ID); labels.push('全部'); parents.push(''); values.push(0); colors.push(0);

    const groupAgg = new Map(); // group -> {value, wchg}
    const subAgg = new Map();   // group||sub -> {value, wchg, group, sub}

    for (const r of rows) {
      if (!groupAgg.has(r.group)) groupAgg.set(r.group, {value:0, wchg:0});
      const g = groupAgg.get(r.group);
      g.value += r.value;
      g.wchg += r.change * r.value;

      if (mode !== 'none') {
        const key = `${r.group}||${r.sub || '未分類'}`;
        if (!subAgg.has(key)) subAgg.set(key, {value:0, wchg:0, group:r.group, sub:(r.sub || '未分類')});
        const s = subAgg.get(key);
        s.value += r.value;
        s.wchg += r.change * r.value;
      }
    }

    for (const [gname, g] of groupAgg.entries()) {
      const gid = `g|${gname}`;
      ids.push(gid);
      labels.push(gname);
      parents.push(ROOT_ID);
      values.push(g.value);
      colors.push(g.value ? (g.wchg / g.value) : 0);
    }

    if (mode !== 'none') {
      for (const s of subAgg.values()) {
        const sid = `s|${s.group}|${s.sub}`;
        ids.push(sid);
        labels.push(s.sub);
        parents.push(`g|${s.group}`);
        values.push(s.value);
        colors.push(s.value ? (s.wchg / s.value) : 0);
      }
    }

    for (const r of rows) {
      const parentId = (mode === 'none')
        ? `g|${r.group}`
        : `s|${r.group}|${r.sub || '未分類'}`;

      const lid = `l|${r.group}|${r.sub || ''}|${r.symbol}`;
      ids.push(lid);
      labels.push(r.symbol);
      parents.push(parentId);
      values.push(r.value);
      colors.push(r.change);
    }

    values[0] = Array.from(groupAgg.values()).reduce((s,x)=>s+x.value,0);
    return {ids, labels, parents, values, colors};
  }

  function renderFromRaw(rawRows) {
    if (!window.Plotly) throw new Error('Plotly 沒有載入成功（CDN 被擋或網路問題）。');
    const mode = $mode.value;
    const rows = normalizeRows(rawRows, mode);
    lastNormalizedRows = rows;

    const {ids, labels, parents, values, colors} = buildTreemap(rows, mode);

    const data = [{
      type: 'treemap',
      ids, labels, parents, values,
      branchvalues: 'total',
      marker: {
        colors,
        colorscale: [
          [0,'#1a9641'],
          [0.5,'#ffffff'],
          [1,'#d7191c']
        ],
        cmid: 0,
        line: { width: 1, color: '#ffffff' }
      },
      hovertemplate:
        '<b>%{label}</b><br>' +
        '上層：%{parent}<br>' +
        '大小：%{value}<br>' +
        '變動：%{color:.2f}<extra></extra>'
    }];

    Plotly.newPlot('chart', data, {margin:{l:10,r:10,t:10,b:10}}, {responsive:true, displaylogo:false});
    setMsg('✅ 已更新熱力圖。', true);
    $btnCopy.disabled = true;
  }

  function loadCSVText(text) {
    const parsed = Papa.parse(text, {header: true, skipEmptyLines: true});
    if (parsed.errors && parsed.errors.length) {
      throw new Error('CSV 解析錯誤：' + parsed.errors[0].message);
    }
    return parsed.data;
  }

  async function handleFile(file) {
    setMsg('');
    const name = (file.name || '').toLowerCase();
    const buf = await file.arrayBuffer();

    if (name.endsWith('.csv')) {
      const text = new TextDecoder('utf-8').decode(buf);
      lastRawRows = loadCSVText(text);
      renderFromRaw(lastRawRows);
      return;
    }

    if (name.endsWith('.json')) {
      const text = new TextDecoder('utf-8').decode(buf);
      const raw = JSON.parse(text);
      lastRawRows = Array.isArray(raw) ? raw : (raw.rows || raw.data || []);
      renderFromRaw(lastRawRows);
      return;
    }

    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      const wb = XLSX.read(buf, {type: 'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      lastRawRows = XLSX.utils.sheet_to_json(sheet, {defval: ''});
      renderFromRaw(lastRawRows);
      return;
    }

    throw new Error('不支援的檔案格式。請用 CSV / XLSX / JSON。');
  }

  function makeShareLink(mode, rawRows) {
    const payload = {v: 3, mode, rawRows};
    const json = JSON.stringify(payload);
    const compressed = LZString.compressToEncodedURIComponent(json);
    return `${location.origin}${location.pathname}#data=${compressed}`;
  }

  function tryLoadFromHash() {
    const hash = location.hash || '';
    if (!hash.startsWith('#data=')) return false;

    try {
      const encoded = hash.slice(6);
      const json = LZString.decompressFromEncodedURIComponent(encoded);
      const payload = JSON.parse(json);

      // 相容舊版（我之前給你的 v1 / v2）
      if (payload?.rawRows && Array.isArray(payload.rawRows)) {
        if (payload.mode) $mode.value = payload.mode;
        lastRawRows = payload.rawRows;
        renderFromRaw(lastRawRows);
        setMsg('✅ 已從分享連結載入資料。', true);
        return true;
      }
      if (payload?.rows && Array.isArray(payload.rows)) {
        // 舊版把 normalized rows 存在 rows：我們就當 raw rows 再跑一次 normalize（比較保險）
        if (payload.mode) $mode.value = payload.mode;
        lastRawRows = payload.rows;
        renderFromRaw(lastRawRows);
        setMsg('✅ 已從分享連結載入資料（舊格式相容）。', true);
        return true;
      }

      throw new Error('hash 內容不正確');
    } catch (e) {
      setMsg('⚠️ 分享連結解析失敗：' + (e?.message || e));
      return false;
    }
  }

  async function loadFromUrl(url) {
    setMsg('');
    if (!url) throw new Error('請貼上 CSV 的公開網址。');

    const res = await fetch(url, {cache: 'no-store'});
    if (!res.ok) throw new Error(`抓取失敗：HTTP ${res.status}`);

    const text = await res.text();
    lastRawRows = loadCSVText(text);
    renderFromRaw(lastRawRows);
  }

  async function loadDefaultCSV() {
    try {
      const res = await fetch('./data.csv', {cache: 'no-store'});
      if (!res.ok) throw new Error(`抓取 data.csv 失敗：HTTP ${res.status}`);
      const text = await res.text();
      lastRawRows = loadCSVText(text);
      renderFromRaw(lastRawRows);
      setMsg('✅ 已載入 data.csv。', true);
    } catch (e) {
      setMsg('⚠️ 載入 data.csv 失敗（本機 file:// 常見限制；GitHub Pages 應該會正常）：' + (e?.message || e));
    }
  }

  // events
  $file.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try { await handleFile(f); }
    catch (err) { setMsg('⚠️ ' + (err?.message || String(err))); }
  });

  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (!f) return;
    try { await handleFile(f); }
    catch (err) { setMsg('⚠️ ' + (err?.message || String(err))); }
  });

  $btnLoadDefault.addEventListener('click', loadDefaultCSV);

  $mode.addEventListener('change', () => {
    try {
      if (!lastRawRows) {
        setMsg('已切換模式。請上傳資料或重載 data.csv 以套用。', true);
        return;
      }
      renderFromRaw(lastRawRows);
    } catch (e) {
      setMsg('⚠️ 切換模式失敗：' + (e?.message || e));
    }
  });

  $btnShare.addEventListener('click', () => {
    try {
      if (!lastRawRows) throw new Error('請先上傳資料或成功載入 data.csv。');
      const url = makeShareLink($mode.value, lastRawRows);
      location.hash = url.split('#')[1];
      setMsg('✅ 已產生分享連結（資料已寫入網址 #hash）。可按「複製分享連結」。', true);
      $btnCopy.disabled = false;
    } catch (err) {
      setMsg('⚠️ ' + (err?.message || String(err)));
    }
  });

  $btnCopy.addEventListener('click', async () => {
    try {
      const url = `${location.origin}${location.pathname}${location.hash}`;
      await navigator.clipboard.writeText(url);
      setMsg('✅ 已複製到剪貼簿。', true);
    } catch (err) {
      setMsg('⚠️ 複製失敗：你可以直接手動複製網址列。');
    }
  });

  $btnLoadUrl.addEventListener('click', async () => {
    try { await loadFromUrl($csvUrl.value.trim()); }
    catch (err) { setMsg('⚠️ ' + (err?.message || String(err))); }
  });

  // boot
  (function boot(){
    try {
      if (!tryLoadFromHash()) loadDefaultCSV();
    } catch(e) {
      setMsg('⚠️ 啟動失敗：' + (e?.message || e));
    }
  })();
</script>
</body>
</html>
